# Local dependencies only. Frontend/backend run on the host with Start-IcareLocal.ps1.
# Reuses the reviewed existing database volume; never use down --volumes.
name: icare-local-db
services:
  db:
    extends:
      file: compose.database.yml
      service: db
volumes:
  existing-db:
    external: true
    name: ${ICARE_DB_VOLUME:?Set the reviewed existing Docker volume name}
