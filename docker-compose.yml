# Local dependencies only. Frontend/backend run on the host with Start-IcareLocal.ps1.
# Reuses the reviewed existing database volume; never use down --volumes.
name: icare-local-db
services:
  db:
    extends:
      file: compose.database.yml
      service: db
  redis:
    image: redis@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    container_name: icare-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ICARE_REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${ICARE_REDIS_PASSWORD:?Set ICARE_REDIS_PASSWORD}
    # Temporary data only; no volume and no persistence. Locks must never be evicted.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory 64mb --maxmemory-policy noeviction"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: redis
    read_only: true
volumes:
  existing-db:
    external: true
    name: ${ICARE_DB_VOLUME:?Set the reviewed existing Docker volume name}
