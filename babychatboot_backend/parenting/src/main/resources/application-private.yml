# Home-PC runtime. Secrets arrive only through external environment variables.
spring:
  datasource:
    url: ${ICARE_DB_URL}
    username: ${ICARE_DB_USER}
    password: ${ICARE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  ai:
    retry:
      max-attempts: 1
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash-lite}
            max-output-tokens: ${ICARE_AI_MAX_OUTPUT_TOKENS:1024}
        embedding:
          api-key: ${GEMINI_API_KEY}
          options:
            model: gemini-embedding-001
            dimensions: 3072
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 3072
        distance-type: COSINE_DISTANCE
        index-type: NONE
jwt:
  secret: ${JWT_SECRET}
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
server:
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 4MB
    max-swallow-size: 4MB
upload:
  dir: ${ICARE_UPLOAD_DIR:/app/uploads}
