spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
    placeholders:
      vectorDimensions: ${spring.ai.vectorstore.pgvector.dimensions}
  profiles:
    default: private
    group:
      dev: private
      prod: private

# Enable only as an explicit, reviewed operation. Normal starts do not seed data.
icare:
  security:
    proxy-secret: ${ICARE_PROXY_SECRET:}
    cors-allowed-origins: ${ICARE_CORS_ALLOWED_ORIGINS:}
  admin:
    bootstrap:
      enabled: false
  bootstrap:
    enabled: false
  knowledge:
    load-on-startup: false
